<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Schede">
<meta name="theme-color" content="#F3EEF4">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<title>Schede</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3EEF4; --ink:#231A2E; --muted:#7C6B8A; --line:#DCD2E0;
  --card:#FFFFFF; --accent:#E8336D; --accent-soft:#FBE3EB; --danger:#C4213F;
}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.4}
body{min-height:100dvh;overscroll-behavior-y:none;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:disabled{opacity:.35;cursor:default}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
main{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 16px) 18px calc(env(safe-area-inset-bottom) + 100px)}

/* Intestazioni */
.top{display:flex;align-items:center;gap:8px}
h1{flex:1;margin:0;font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1.1;font-variation-settings:'opsz' 96}
.icon{flex:none;width:40px;height:40px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink)}
.icon svg{width:19px;height:19px}

/* Selettore workout: l'elemento protagonista */
.picker{position:relative}
.picker select{appearance:none;-webkit-appearance:none;width:100%;margin:0;padding:0 40px 0 0;border:0;background:none;color:var(--ink);font:inherit;font-size:36px;font-weight:800;letter-spacing:-.025em;line-height:1.1;font-variation-settings:'opsz' 96;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.picker .chev{position:absolute;right:0;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;pointer-events:none}
.picker .chev svg{width:18px;height:18px}
.bar{width:48px;height:5px;border-radius:3px;background:var(--accent);margin:10px 0 0}
.sub{display:flex;align-items:center;gap:8px;margin-top:14px}
.sub span{flex:1;color:var(--muted);font-size:15px}

/* Esercizi nel workout */
.list{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.item{display:grid;grid-template-columns:26px 72px 1fr;gap:12px;align-items:center;background:var(--card);border-radius:18px;padding:10px 14px 10px 8px;cursor:pointer}
.num{font-size:22px;font-weight:800;color:var(--accent);text-align:center;font-variant-numeric:tabular-nums}
.thumb{width:72px;height:72px;border-radius:13px;overflow:hidden;background:var(--accent-soft);display:grid;place-items:center;font-weight:800;color:var(--accent);font-size:22px}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.meta{min-width:0}
.meta h3{margin:0;font-size:17px;font-weight:700;line-height:1.2}
.meta .grp-l{font-size:13px;color:var(--muted)}
.stats{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
.stats span{font-size:13px;color:var(--muted);background:var(--bg);padding:3px 8px;border-radius:8px;white-space:nowrap}
.stats b{color:var(--ink);font-weight:700}
.meta .note{margin:6px 0 0;font-size:13px;color:var(--muted);white-space:pre-line}
.add-row{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:12px;padding:16px;border:1.5px dashed var(--line);border-radius:18px;color:var(--accent);font-weight:700}
.add-row svg{width:18px;height:18px}
.hint{color:var(--muted);margin:6px 4px}

/* Archivio */
.search{width:100%;margin-top:16px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);font:inherit;font-size:16px;color:var(--ink);-webkit-appearance:none;appearance:none}
.chips{display:flex;gap:8px;overflow-x:auto;margin:12px -18px 0;padding:0 18px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border-radius:20px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--muted)}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px;margin-top:16px}
.tile{text-align:left;display:block;width:100%}
.tile .ph{aspect-ratio:1;border-radius:16px;border:1px solid var(--line);overflow:hidden;background:var(--accent-soft);display:grid;place-items:center;font-size:30px;font-weight:800;color:var(--accent)}
.tile .ph img{width:100%;height:100%;object-fit:cover;display:block}
.tile h3{margin:7px 2px 0;font-size:15px;font-weight:700;line-height:1.2}
.tile p{margin:1px 2px 0;font-size:13px;color:var(--muted)}

.empty{text-align:center;padding:48px 16px}
.empty p{color:var(--muted);max-width:30ch;margin:0 auto 18px}
.primary{background:var(--accent);color:#fff;border-radius:14px;padding:14px 22px;font-weight:700}

/* Barra dei tab */
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:rgba(243,238,244,.9);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:6px 0 calc(env(safe-area-inset-bottom) + 4px);z-index:10}
.tabbar button{flex:1;max-width:200px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:4px}
.tabbar button[aria-current=true]{color:var(--accent)}
.tabbar svg{width:26px;height:26px}

/* Pannello a scomparsa */
.scrim{position:fixed;inset:0;background:rgba(35,26,46,.42);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;max-height:92dvh;background:var(--bg);border-radius:22px 22px 0 0;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);z-index:21;display:flex;flex-direction:column}
.sheet.open{transform:none}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 18px calc(env(safe-area-inset-bottom) + 24px)}
.sheet-head{position:sticky;top:0;z-index:2;background:var(--bg);display:grid;grid-template-columns:minmax(76px,1fr) auto minmax(76px,1fr);align-items:center;gap:8px;padding:16px 0 10px}
.sheet-head h2{margin:0;font-size:17px;font-weight:700;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.sheet-head .txt:last-child{justify-self:end}
.txt{color:var(--accent);font-size:16px;padding:6px 0;justify-self:start;white-space:nowrap}
.txt.strong{font-weight:700}
.field{display:block;margin-top:14px}
.field>span{display:block;font-size:13px;color:var(--muted);margin:0 0 6px 4px}
.field input,.field select,.field textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--ink);font:inherit;font-size:16px;-webkit-appearance:none;appearance:none;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.photo{position:relative;display:grid;place-items:center;aspect-ratio:4/3;background:var(--card);border:1.5px dashed var(--line);border-radius:16px;overflow:hidden;color:var(--accent);font-weight:700;margin-top:4px}
.photo img{width:100%;height:100%;object-fit:cover}
.photo input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.photo-tools{display:flex;justify-content:flex-end;margin-top:6px}
.photo-tools .txt{font-size:14px}
.hero{display:block;width:100%;max-height:240px;object-fit:cover;border-radius:16px;margin-top:4px}
.exnote{margin:10px 4px 0;font-size:14px;color:var(--muted);white-space:pre-line}
.ghost{padding:13px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:600}
.moves{margin-top:18px}
.danger{width:100%;margin-top:14px;padding:14px;border-radius:12px;background:var(--card);color:var(--danger);font-weight:600}
.stack{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.stack .ghost{text-align:left;padding:15px 16px}

/* Selezione dall'archivio */
.grp-h{font-size:13px;color:var(--muted);margin:18px 4px 0;font-weight:700}
.pick{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:8px 12px 8px 8px;border-radius:14px;background:var(--card);margin-top:8px;border:1.5px solid transparent}
.pick .thumb{width:48px;height:48px;border-radius:10px;font-size:16px;flex:none}
.pick .pm{flex:1;min-width:0}
.pick b{display:block;font-weight:700;font-size:15px}
.pick small{color:var(--muted);font-size:12px}
.pick .ck{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:#fff}
.pick .ck svg{width:14px;height:14px;opacity:0}
.pick[aria-pressed=true]{border-color:var(--accent)}
.pick[aria-pressed=true] .ck{background:var(--accent);border-color:var(--accent)}
.pick[aria-pressed=true] .ck svg{opacity:1}

/* Foto a schermo intero */
.zoom{position:fixed;inset:0;z-index:30;background:rgba(20,14,26,.94);display:none;flex-direction:column;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 20px);color:#fff}
.zoom.open{display:flex}
.zoom img{max-width:100%;max-height:80dvh;border-radius:14px}
.zoom p{margin:14px 0 0;font-weight:700;font-size:18px}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 84px);transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:40}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="view"></main>

<nav class="tabbar" aria-label="Sezioni">
  <button data-tab="arch" aria-current="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg>
    Archivio
  </button>
  <button data-tab="wk" aria-current="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/></svg>
    Workout
  </button>
</nav>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="sheet-body" id="sheetBody"></div></section>
<div class="zoom" id="zoom" role="dialog" aria-label="Foto"><img alt=""><p></p></div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ---------- Costanti e utilità ---------- */
const GROUPS=['Glutei','Gambe','Spalle','Addome','Schiena','Petto','Braccia','Cardio','Altro'];
const ICON={
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4"/></svg>',
  dots:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>',
  chev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'
};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const initials=n=>(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const norm=s=>(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');

let S={exercises:[],workouts:[],current:null,tab:'wk'};
let archQ='',archG='Tutti';

/* ---------- Salvataggio (IndexedDB: regge bene anche le foto) ---------- */
let dbP=null;
function db(){
  if(!dbP) dbP=new Promise((res,rej)=>{
    const r=indexedDB.open('schede-db',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('kv');
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
  return dbP;
}
async function load(){
  try{
    const d=await db();
    return await new Promise((res,rej)=>{const q=d.transaction('kv').objectStore('kv').get('state');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});
  }catch(e){return null}
}
let saveT;
function save(){
  clearTimeout(saveT);
  saveT=setTimeout(async()=>{
    try{
      const d=await db();
      const tx=d.transaction('kv','readwrite');tx.objectStore('kv').put(S,'state');
      tx.onerror=()=>toast('Salvataggio non riuscito');
    }catch(e){toast('Salvataggio non riuscito')}
  },120);
}

/* ---------- Helpers dati ---------- */
const exById=id=>S.exercises.find(e=>e.id===id);
function cur(){
  let w=S.workouts.find(x=>x.id===S.current);
  if(!w&&S.workouts.length){w=S.workouts[0];S.current=w.id}
  return w;
}
function thumb(ex){return ex.img?`<img src="${ex.img}" alt="">`:`<span>${esc(initials(ex.name))}</span>`}

/* ---------- Viste ---------- */
function render(){
  $('#view').innerHTML=S.tab==='arch'?viewArch():viewWk();
  document.querySelectorAll('.tabbar button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===S.tab));
  const sel=$('#wkSel');
  if(sel) sel.onchange=()=>{S.current=sel.value;save();render();window.scrollTo(0,0)};
  const q=$('#archQ');
  if(q) q.oninput=()=>{archQ=q.value;$('#grid').innerHTML=gridHTML()};
}

function viewWk(){
  const w=cur();
  if(!w) return `<div class="top"><h1>Workout</h1></div>
    <div class="empty"><p>Crea il tuo primo workout, poi riempilo con gli esercizi dell'archivio.</p><button class="primary" data-act="newWk">Crea workout</button></div>`;
  const items=w.items.map((it,i)=>{
    const ex=exById(it.exId); if(!ex) return '';
    const st=[];
    if(it.sets||it.reps) st.push(`<span><b>${esc(it.sets||'–')}</b> × <b>${esc(it.reps||'–')}</b></span>`);
    if(it.weight) st.push(`<span><b>${esc(it.weight)}</b> kg</span>`);
    if(it.rest) st.push(`<span><b>${esc(it.rest)}</b> s rec.</span>`);
    return `<div class="item" role="button" tabindex="0" data-item="${it.id}">
      <span class="num">${i+1}</span>
      <div class="thumb" ${ex.img?`data-zoom="${ex.id}"`:''}>${thumb(ex)}</div>
      <div class="meta"><h3>${esc(ex.name)}</h3><div class="grp-l">${esc(ex.group)}</div>
        ${st.length?`<div class="stats">${st.join('')}</div>`:''}
        ${it.notes?`<p class="note">${esc(it.notes)}</p>`:''}
      </div></div>`;
  }).join('');
  const n=w.items.length;
  return `<div class="picker"><select id="wkSel" aria-label="Scegli il workout">
      ${S.workouts.map(x=>`<option value="${x.id}" ${x.id===w.id?'selected':''}>${esc(x.name)}</option>`).join('')}
    </select><span class="chev">${ICON.chev}</span></div>
    <div class="bar"></div>
    <div class="sub"><span>${n===1?'1 esercizio':n+' esercizi'}</span>
      <button class="icon" data-act="editWk" aria-label="Modifica workout">${ICON.edit}</button>
      <button class="icon" data-act="newWk" aria-label="Nuovo workout">${ICON.plus}</button></div>
    <div class="list">${items||'<p class="hint">Workout vuoto: aggiungi gli esercizi qui sotto.</p>'}</div>
    <button class="add-row" data-act="pick">${ICON.plus}Aggiungi esercizi</button>`;
}

function viewArch(){
  const used=GROUPS.filter(g=>S.exercises.some(e=>e.group===g));
  if(archG!=='Tutti'&&!used.includes(archG)) archG='Tutti';
  const head=`<div class="top"><h1>Archivio</h1>
    <button class="icon" data-act="backup" aria-label="Backup">${ICON.dots}</button>
    <button class="icon" data-act="newEx" aria-label="Nuovo esercizio">${ICON.plus}</button></div>`;
  if(!S.exercises.length) return head+`<div class="empty"><p>Qui vivono tutti i tuoi esercizi. Aggiungi il primo con una foto della macchina o del movimento.</p><button class="primary" data-act="newEx">Aggiungi esercizio</button></div>`;
  return head+`<input class="search" id="archQ" type="search" placeholder="Cerca esercizio" value="${esc(archQ)}">
    <div class="chips">${['Tutti',...used].map(g=>`<button class="chip" data-chip="${g}" aria-pressed="${g===archG}">${g}</button>`).join('')}</div>
    <div class="grid" id="grid">${gridHTML()}</div>`;
}
function gridHTML(){
  const q=norm(archQ);
  const list=S.exercises
    .filter(e=>(archG==='Tutti'||e.group===archG)&&(!q||norm(e.name).includes(q)))
    .sort((a,b)=>a.name.localeCompare(b.name,'it'));
  if(!list.length) return `<p class="hint" style="grid-column:1/-1">Nessun esercizio trovato.</p>`;
  return list.map(e=>`<button class="tile" data-ex="${e.id}"><div class="ph">${thumb(e)}</div><h3>${esc(e.name)}</h3><p>${esc(e.group)}</p></button>`).join('');
}

/* ---------- Pannello ---------- */
function openSheet(html,mount){
  $('#sheetBody').innerHTML=html; $('#sheetBody').scrollTop=0;
  $('#sheet').classList.add('open'); $('#scrim').classList.add('open');
  mount&&mount($('#sheetBody'));
}
function closeSheet(){$('#sheet').classList.remove('open');$('#scrim').classList.remove('open');document.activeElement?.blur()}
$('#scrim').onclick=closeSheet;
const head=(title,right='')=>`<div class="sheet-head"><button class="txt" data-close>Annulla</button><h2>${esc(title)}</h2>${right||'<span></span>'}</div>`;

/* Esercizio in archivio */
function compress(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file), im=new Image();
    im.onload=()=>{
      const k=Math.min(1,900/Math.max(im.width,im.height));
      const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',.8));
    };
    im.onerror=()=>{URL.revokeObjectURL(url);rej()};
    im.src=url;
  });
}
function exSheet(id){
  const ex=id?exById(id):{name:'',group:archG!=='Tutti'?archG:'Glutei',notes:'',img:null};
  let img=ex.img;
  const photo=()=>img?`<img src="${img}" alt="">`:`<span>Aggiungi foto</span>`;
  openSheet(head(id?'Modifica esercizio':'Nuovo esercizio','<button class="txt strong" id="exSave">Salva</button>')+`
    <label class="photo" id="photoBox">${photo()}<input type="file" accept="image/*" id="photoIn" aria-label="Scegli foto"></label>
    <div class="photo-tools" id="photoTools" ${img?'':'hidden'}><button class="txt" id="photoDel">Rimuovi foto</button></div>
    <label class="field"><span>Nome</span><input id="exName" value="${esc(ex.name)}" placeholder="Es. Hip thrust" autocomplete="off"></label>
    <label class="field"><span>Gruppo muscolare</span><select id="exGroup">${GROUPS.map(g=>`<option ${g===ex.group?'selected':''}>${g}</option>`).join('')}</select></label>
    <label class="field"><span>Note</span><textarea id="exNotes" rows="3" placeholder="Regolazioni della macchina, esecuzione…">${esc(ex.notes)}</textarea></label>
    ${id?'<button class="danger" id="exDel">Elimina esercizio</button>':''}`,
  b=>{
    const refresh=()=>{
      b.querySelector('#photoBox').innerHTML=photo()+'<input type="file" accept="image/*" id="photoIn" aria-label="Scegli foto">';
      b.querySelector('#photoTools').hidden=!img; bindIn();
    };
    const bindIn=()=>{b.querySelector('#photoIn').onchange=async e=>{
      const f=e.target.files[0]; if(!f) return;
      try{img=await compress(f);refresh()}catch{toast('Foto non leggibile, prova con un\'altra')}
    }};
    bindIn();
    b.querySelector('#photoDel').onclick=()=>{img=null;refresh()};
    b.querySelector('#exSave').onclick=()=>{
      const name=b.querySelector('#exName').value.trim();
      if(!name){toast('Dai un nome all\'esercizio');b.querySelector('#exName').focus();return}
      const data={name,group:b.querySelector('#exGroup').value,notes:b.querySelector('#exNotes').value.trim(),img};
      if(id) Object.assign(ex,data); else S.exercises.push({id:uid(),...data});
      save();closeSheet();render();toast(id?'Esercizio salvato':'Esercizio aggiunto');
    };
    const del=b.querySelector('#exDel');
    if(del) del.onclick=()=>{
      const n=S.workouts.filter(w=>w.items.some(i=>i.exId===id)).length;
      if(!confirm(n?`Eliminare "${ex.name}"? Verrà tolto anche da ${n===1?'1 workout':n+' workout'}.`:`Eliminare "${ex.name}"?`)) return;
      S.exercises=S.exercises.filter(e=>e.id!==id);
      S.workouts.forEach(w=>w.items=w.items.filter(i=>i.exId!==id));
      save();closeSheet();render();toast('Esercizio eliminato');
    };
  });
}

/* Workout: nuovo e modifica */
function newWkSheet(){
  openSheet(head('Nuovo workout','<button class="txt strong" id="wkSave">Crea</button>')+`
    <label class="field"><span>Nome</span><input id="wkName" placeholder="Es. Glutei e addome" autocomplete="off"></label>`,
  b=>{
    b.querySelector('#wkSave').onclick=()=>{
      const name=b.querySelector('#wkName').value.trim();
      if(!name){toast('Dai un nome al workout');return}
      const w={id:uid(),name,items:[]};S.workouts.push(w);S.current=w.id;S.tab='wk';
      save();closeSheet();render();toast('Workout creato');
    };
  });
}
function editWkSheet(){
  const w=cur();
  openSheet(head('Modifica workout','<button class="txt strong" id="wkSave">Salva</button>')+`
    <label class="field"><span>Nome</span><input id="wkName" value="${esc(w.name)}" autocomplete="off"></label>
    <div class="stack"><button class="ghost" id="wkDup">Duplica workout</button></div>
    <button class="danger" id="wkDel">Elimina workout</button>`,
  b=>{
    b.querySelector('#wkSave').onclick=()=>{
      const name=b.querySelector('#wkName').value.trim();
      if(!name){toast('Dai un nome al workout');return}
      w.name=name;save();closeSheet();render();toast('Workout salvato');
    };
    b.querySelector('#wkDup').onclick=()=>{
      const c={id:uid(),name:w.name+' (copia)',items:w.items.map(i=>({...i,id:uid()}))};
      S.workouts.splice(S.workouts.indexOf(w)+1,0,c);S.current=c.id;
      save();closeSheet();render();toast('Workout duplicato');
    };

      save();closeSheet();render();toast('Workout eliminato');
    };
  });
}

/* Scelta esercizi dall'archivio */
function pickSheet(){
  const w=cur();
  if(!S.exercises.length){
    openSheet(head('Aggiungi esercizi')+`<div class="empty"><p>L'archivio è ancora vuoto. Aggiungi prima qualche esercizio.</p><button class="primary" id="goArch">Vai all'archivio</button></div>`,
      b=>b.querySelector('#goArch').onclick=()=>{closeSheet();S.tab='arch';save();render()});
    return;
  }
  const sel=[]; let q='';
  const list=()=>{
    const f=S.exercises.filter(e=>!q||norm(e.name).includes(norm(q)));
    if(!f.length) return '<p class="hint">Nessun esercizio trovato.</p>';
    return GROUPS.map(g=>{
      const xs=f.filter(e=>e.group===g).sort((a,b)=>a.name.localeCompare(b.name,'it'));
      if(!xs.length) return '';
      return `<div class="grp-h">${g}</div>`+xs.map(e=>`<button class="pick" data-pk="${e.id}" aria-pressed="${sel.includes(e.id)}">
        <div class="thumb">${thumb(e)}</div>
        <div class="pm"><b>${esc(e.name)}</b>${w.items.some(i=>i.exId===e.id)?'<small>Già nel workout</small>':''}</div>
        <span class="ck">${ICON.check}</span></button>`).join('');
    }).join('');
  };
  openSheet(head('Aggiungi esercizi','<button class="txt strong" id="pkAdd" disabled>Aggiungi</button>')+`
    <input class="search" id="pkQ" type="search" placeholder="Cerca nell'archivio" style="margin-top:4px">
    <div id="pkList">${list()}</div>`,
  b=>{
    const btn=b.querySelector('#pkAdd');
    const upd=()=>{btn.disabled=!sel.length;btn.textContent=sel.length?`Aggiungi (${sel.length})`:'Aggiungi'};
    b.querySelector('#pkQ').oninput=e=>{q=e.target.value;b.querySelector('#pkList').innerHTML=list()};
    b.querySelector('#pkList').onclick=e=>{
      const p=e.target.closest('[data-pk]'); if(!p) return;
      const id=p.dataset.pk, k=sel.indexOf(id);
      k<0?sel.push(id):sel.splice(k,1);
      p.setAttribute('aria-pressed',k<0);upd();
    };
    btn.onclick=()=>{
      sel.forEach(exId=>w.items.push({id:uid(),exId,sets:'3',reps:'10',weight:'',rest:'90',notes:''}));
      save();closeSheet();render();toast(sel.length===1?'Esercizio aggiunto':`${sel.length} esercizi aggiunti`);
    };
  });
}

/* Parametri dell'esercizio nel workout */
function itemSheet(itemId){
  const w=cur(), it=w.items.find(i=>i.id===itemId), ex=exById(it.exId);
  openSheet(head(ex.name,'<button class="txt strong" id="itSave">Salva</button>')+`
    ${ex.img?`<img class="hero" src="${ex.img}" alt="">`:''}
    ${ex.notes?`<p class="exnote">${esc(ex.notes)}</p>`:''}
    <div class="row2">
      <label class="field"><span>Serie</span><input id="fSets" inputmode="numeric" value="${esc(it.sets)}"></label>
      <label class="field"><span>Ripetizioni</span><input id="fReps" value="${esc(it.reps)}" placeholder="10 o 8-12"></label>
    </div>
    <div class="row2">
      <label class="field"><span>Carico (kg)</span><input id="fW" inputmode="decimal" value="${esc(it.weight)}"></label>
      <label class="field"><span>Recupero (sec)</span><input id="fRest" inputmode="numeric" value="${esc(it.rest)}"></label>
    </div>
    <label class="field"><span>Note per questo workout</span><textarea id="fNotes" rows="2">${esc(it.notes)}</textarea></label>
    <div class="row2 moves"><button class="ghost" id="mvUp">Sposta su</button><button class="ghost" id="mvDn">Sposta giù</button></div>
    <button class="danger" id="itDel">Rimuovi dal workout</button>`,
  b=>{
    const v=s=>b.querySelector(s).value.trim();
    const collect=()=>Object.assign(it,{sets:v('#fSets'),reps:v('#fReps'),weight:v('#fW').replace('.',','),rest:v('#fRest'),notes:v('#fNotes')});
    const states=()=>{const i=w.items.indexOf(it);b.querySelector('#mvUp').disabled=i===0;b.querySelector('#mvDn').disabled=i===w.items.length-1};
    const move=d=>{const i=w.items.indexOf(it);w.items.splice(i,1);w.items.splice(i+d,0,it);collect();save();render();states()};
    states();
    b.querySelector('#mvUp').onclick=()=>move(-1);
    b.querySelector('#mvDn').onclick=()=>move(1);
    b.querySelector('#itSave').onclick=()=>{collect();save();closeSheet();render();toast('Salvato')};
    b.querySelector('#itDel').onclick=()=>{
      w.items=w.items.filter(i=>i!==it);save();closeSheet();render();toast('Rimosso dal workout');
    };
  });
}

/* Backup */
function backupSheet(){
  openSheet(head('Backup')+`
    <p class="exnote">I dati restano solo su questo iPhone. Esporta un backup ogni tanto (per esempio su iCloud Drive) per non perderli.</p>
    <div class="stack">
      <button class="ghost" id="bkExp">Esporta backup</button>
      <label class="ghost" style="position:relative;display:block">Importa backup<input type="file" id="bkImp" accept="application/json,.json" style="position:absolute;inset:0;opacity:0;width:100%"></label>
    </div>`,
  b=>{
    b.querySelector('#bkExp').onclick=exportData;
    b.querySelector('#bkImp').onchange=async e=>{
      const f=e.target.files[0]; if(!f) return;
      try{
        const d=JSON.parse(await f.text());
        if(!Array.isArray(d.exercises)||!Array.isArray(d.workouts)) throw 0;
        if(!confirm(`Il backup contiene ${d.exercises.length} esercizi e ${d.workouts.length} workout. Sostituire i dati attuali?`)) return;
        S.exercises=d.exercises;S.workouts=d.workouts;S.current=d.workouts[0]?.id||null;
        save();closeSheet();render();toast('Backup importato');
      }catch{toast('File di backup non valido')}
    };
  });
}
async function exportData(){
  const name=`schede-backup-${new Date().toISOString().slice(0,10)}.json`;
  const json=JSON.stringify({app:'schede',v:1,date:new Date().toISOString(),exercises:S.exercises,workouts:S.workouts});
  const file=new File([json],name,{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:name});return}catch(e){if(e.name==='AbortError')return}
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);
}

  const z=$('#zoom'); z.querySelector('img').src=ex.img; z.querySelector('p').textContent=ex.name; z.classList.add('open');
}
$('#zoom').onclick=()=>$('#zoom').classList.remove('open');

let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1800)}

/* ---------- Eventi ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-zoom],[data-close],[data-tab],[data-act],[data-item],[data-ex],[data-chip]');
  if(!t) return;
  const d=t.dataset;
  if(d.zoom){zoom(d.zoom);return}
  if(d.close!==undefined){closeSheet();return}
  if(d.tab){S.tab=d.tab;save();render();window.scrollTo(0,0);return}
  if(d.chip){archG=d.chip;render();return}
  if(d.item){itemSheet(d.item);return}
  if(d.ex){exSheet(d.ex);return}
  ({newWk:newWkSheet,editWk:editWkSheet,pick:pickSheet,newEx:()=>exSheet(null),backup:backupSheet})[d.act]?.();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.matches('[data-item]')) itemSheet(e.target.dataset.item);
  if(e.key==='Escape'){closeSheet();$('#zoom').classList.remove('open')}
});

function seed(){
  if(S.seeded) return;
  const have=new Set(S.exercises.map(e=>norm(e.name)));
  let n=0;
  SEED.forEach(e=>{if(!have.has(norm(e.name))){S.exercises.push({id:uid(),...e});n++}});
  S.seeded=true; save();
  if(n) setTimeout(()=>toast(n+' esercizi aggiunti all\'archivio'),400);
}

/* ---------- Avvio ---------- */
(async()=>{
  const d=await load();
  if(d) S={...S,...d};
  seed();
  render();
  navigator.storage?.persist?.();
  if('serviceWorker' in navigator&&location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
